services:
  # Neo4j Graph Database
  db_neo4j:
    image: neo4j:5
    container_name: ${PROJECT_NAME}_db_neo4j
    profiles:
      - neo4j
      - all
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_initial_dbms_default__database=${NEO4J_DATABASE}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*

  # PostgreSQL + Apache AGE (Graph Extension)
  db_postgres:
    image: apache/age:${AGE_IMAGE_TAG}
    container_name: ${PROJECT_NAME}_db_postgres
    profiles:
      - postgres
      - langfuse
      - all
    ports:
      - "${POSTGRES_PORT}:5432"
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LANGFUSE_DB_NAME=${LANGFUSE_DB_NAME:-db_langfuse}
      - TZ=Asia/Seoul
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # MongoDB NoSQL Database
  db_mongo:
    image: mongo:7
    container_name: ${PROJECT_NAME}_db_mongo
    profiles:
      - mongo
      - all
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}

  # Ollama Server
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ${PROJECT_NAME}_ai_ollama
    profiles:
      - ollama
      - all
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          cpus: ${AI_OLAMA_CPU}
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OLLAMA_NUM_PARALLEL=${AI_OLAMA_CPU}
      - OLLAMA_MAX_LOADED_MODELS=1

  # Langfuse LLM Observability & Tracing Platform
  langfuse:
    image: ghcr.io/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-2}
    container_name: ${PROJECT_NAME}_langfuse
    profiles:
      - langfuse
      - all
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${LANGFUSE_DB_NAME:-db_langfuse}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-default_langfuse_nextauth_secret_32bytes}
      - SALT=${LANGFUSE_SALT:-default_langfuse_salt_32bytes}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      - TELEMETRY_ENABLED=${LANGFUSE_TELEMETRY_ENABLED:-false}
      # Headless Bootstrap Initialization (Automatic Setup)
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-graphrag-org}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-GraphRAG Organization}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-graphrag-project}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-Demon Slayer GraphRAG}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-graphrag-agent-public}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-graphrag-agent-secret}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-admin123456}
    depends_on:
      - db_postgres

  # FastAPI application (no published ports; access via docker network / exec)
  app_fullstack:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    container_name: ${PROJECT_NAME}_app_fullstack
    profiles:
      - app
      - all
    # restart: unless-stopped
    env_file:
      - .env
    stdin_open: true
    tty: true


services:
  # Neo4j Graph Database
  db_neo4j:
    image: neo4j:5
    container_name: ${PROJECT_NAME}_db_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_initial_dbms_default__database=${NEO4J_DATABASE}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*

  # PostgreSQL + Apache AGE (Graph Extension)
  db_postgres:
    image: apache/age:${AGE_IMAGE_TAG}
    container_name: ${PROJECT_NAME}_db_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Seoul
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Ollama Server
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ${PROJECT_NAME}_ai_ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          cpus: ${AI_OLAMA_CPU}
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OLLAMA_NUM_PARALLEL=${AI_OLAMA_CPU}
      - OLLAMA_MAX_LOADED_MODELS=1

  # FastAPI application (no published ports; access via docker network / exec)
  app_fullstack:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    container_name: ${PROJECT_NAME}_app_fullstack
    # restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db_neo4j
      - db_postgres
      - ollama
    stdin_open: true
    tty: true
